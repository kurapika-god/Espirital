<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Espirital</title>
<style>
  html,body{margin:0;height:100%;background:#020106;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  #stage{--u:10px;position:relative;width:min(100vw,calc(100dvh*16/9));aspect-ratio:16/9;overflow:hidden;
    font-family:"Courier New",Courier,monospace;font-weight:700;color:#e9ddff;user-select:none;-webkit-user-select:none;background:#07040f}
  #bg{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
  .fx{position:absolute;inset:0;pointer-events:none}
  .vig{background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(3,1,8,.78) 100%)}
  .scan{background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 calc(var(--u)*.25),transparent calc(var(--u)*.25) calc(var(--u)*.5))}
  #stage.noscan .scan{display:none}
  .dim{background:rgba(4,2,10,.5);opacity:0;transition:opacity .35s}
  #stage.panel .dim{opacity:1}

  #titleWrap{position:absolute;left:50%;top:calc(var(--u)*3);transform:translateX(-50%);text-align:center;transition:opacity .3s}
  #stage.panel #titleWrap{opacity:0}
  #title{width:calc(var(--u)*46);height:auto;image-rendering:pixelated;display:block;
    filter:drop-shadow(0 0 calc(var(--u)*1) rgba(150,90,255,.75));animation:glow 3.4s ease-in-out infinite}
  @keyframes glow{50%{filter:drop-shadow(0 0 calc(var(--u)*1.9) rgba(255,130,230,.85))}}
  #sub{font-size:calc(var(--u)*1.5);letter-spacing:calc(var(--u)*.7);color:#c7a9f5;margin-top:calc(var(--u)*.4);
    text-shadow:0 0 calc(var(--u)*.8) #8a5cd0,calc(var(--u)*.2) calc(var(--u)*.2) 0 #000}

  #splash{position:absolute;left:50%;top:calc(var(--u)*38);transform:translateX(-50%);white-space:nowrap;
    font-size:calc(var(--u)*2);letter-spacing:calc(var(--u)*.4);color:#fff;text-shadow:0 0 calc(var(--u)*.9) #b07cff,calc(var(--u)*.2) calc(var(--u)*.2) 0 #000;
    animation:blink 1.1s steps(1) infinite;cursor:pointer}
  #stage.started #splash{display:none}
  @keyframes blink{50%{opacity:0}}

  #menu{position:absolute;left:50%;top:calc(var(--u)*32);transform:translateX(-50%);width:calc(var(--u)*28);
    display:flex;flex-direction:column;gap:calc(var(--u)*1.1);opacity:0;pointer-events:none;transition:top .3s}
  #stage.started #menu{opacity:1;pointer-events:auto}
  #stage.panel #menu{top:calc(var(--u)*8)}
  #menu.wide{width:calc(var(--u)*40)}
  #stage:not(.panel) #menu:has(.item:nth-child(5)){top:calc(var(--u)*27);gap:calc(var(--u)*.6)}
  #menu:has(.item:nth-child(5)) .item{padding:calc(var(--u)*.6) calc(var(--u)*2)}
  #menu.in>*{animation:rise .28s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(calc(var(--u)*1.2))}to{opacity:1;transform:none}}

  .head{text-align:center;font-size:calc(var(--u)*2.4);letter-spacing:calc(var(--u)*.5);color:#ff9fe6;
    text-shadow:0 0 calc(var(--u)*.9) #c24fd8,calc(var(--u)*.25) calc(var(--u)*.25) 0 #000;margin-bottom:calc(var(--u)*.6)}
  .item{position:relative;display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*1.5);
    padding:calc(var(--u)*1.1) calc(var(--u)*2);font-size:calc(var(--u)*2.1);letter-spacing:calc(var(--u)*.25);
    background:rgba(18,8,36,.84);color:#cdb8f5;cursor:pointer;
    border:calc(var(--u)*.35) solid #5b3a96;
    box-shadow:0 calc(var(--u)*.5) 0 #04020a,inset 0 0 0 calc(var(--u)*.2) #0b0518;
    text-shadow:calc(var(--u)*.2) calc(var(--u)*.2) 0 #000;transition:transform .08s}
  .item.row{justify-content:space-between}
  .item.sel{background:#5b2fa8;border-color:#e0c8ff;color:#fff;transform:translateX(calc(var(--u)*.5));
    box-shadow:0 calc(var(--u)*.5) 0 #04020a,0 0 calc(var(--u)*1.6) rgba(170,110,255,.55),inset 0 0 0 calc(var(--u)*.2) #2a1260}
  .item.sel::before{content:"\25B6";position:absolute;left:calc(var(--u)*-3.2);color:#ff9fe6;font-size:calc(var(--u)*2);animation:blink .8s steps(1) infinite}
  .ctl{display:flex;align-items:center;gap:calc(var(--u)*.8)}
  .arr{padding:0 calc(var(--u)*.5);color:#ff9fe6;cursor:pointer}
  .arr:hover{color:#fff}
  .bar{display:flex;gap:calc(var(--u)*.3)}
  .seg{width:calc(var(--u)*.9);height:calc(var(--u)*1.7);background:#2a1850}
  .seg.on{background:linear-gradient(#ffc2f0,#b55cd6)}
  .val{color:#ffc2f0}
  .box{background:rgba(18,8,36,.84);border:calc(var(--u)*.35) solid #5b3a96;padding:calc(var(--u)*1.6) calc(var(--u)*2);
    text-align:center;font-size:calc(var(--u)*1.7);line-height:1.7;color:#d9c8ff;box-shadow:0 calc(var(--u)*.5) 0 #04020a}
  .box small{display:block;color:#9b7fd0;font-size:calc(var(--u)*1.3)}
  .box b{color:#ff9fe6}

  #toast{position:absolute;left:50%;bottom:calc(var(--u)*7);transform:translateX(-50%);padding:calc(var(--u)*.9) calc(var(--u)*2);
    background:rgba(18,8,36,.92);border:calc(var(--u)*.3) solid #ff9fe6;color:#fff;font-size:calc(var(--u)*1.7);
    opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
  #toast.show{opacity:1}
  #mute{position:absolute;right:calc(var(--u)*1.5);top:calc(var(--u)*1.5);width:calc(var(--u)*4);height:calc(var(--u)*4);
    background:rgba(18,8,36,.8);border:calc(var(--u)*.3) solid #5b3a96;color:#ff9fe6;font:inherit;font-size:calc(var(--u)*2.2);cursor:pointer;
    display:none;align-items:center;justify-content:center;padding:0}
  #stage.started #mute{display:flex}
  #mute.off{color:#6a5a8a;text-decoration:line-through}
  .foot{position:absolute;bottom:calc(var(--u)*1.2);font-size:calc(var(--u)*1.2);letter-spacing:calc(var(--u)*.2);color:#8a6cc0;opacity:.85}
  #ver{left:calc(var(--u)*1.6)}
  #hint{right:calc(var(--u)*1.6);display:none}
  #stage.started #hint{display:block}

  #toast{z-index:40}#mute{z-index:40}
  #stage.inGame #titleWrap,#stage.inGame #menu,#stage.inGame #hint{opacity:0;pointer-events:none}
  #stage.infight #titleWrap,#stage.infight #menu,#stage.infight #hint,#stage.infight #bg,#stage.infight .dim,#stage.infight .vig,#stage.infight #splash,#stage.infight #ver{display:none!important;animation:none!important}
  #stage.infight .scan:not(#gscan){display:none}
  #game{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:20;display:none;cursor:none;background:#000}
  #stage.infight #game{display:block}
  #gscan{z-index:21;display:none}
  #stage.infight #gscan{display:block}
  #stage.noscan #gscan{display:none}
  #stage.infight #mute{display:none}

  #gui{position:absolute;inset:0;z-index:15;display:none}
  #gui.on{display:block;background:rgba(5,2,12,.74)}
  .gtitle{position:absolute;left:0;right:0;top:calc(var(--u)*3);text-align:center;font-size:calc(var(--u)*3);letter-spacing:calc(var(--u)*.5);
    color:#ff9fe6;text-shadow:0 0 calc(var(--u)*1) #c24fd8,calc(var(--u)*.25) calc(var(--u)*.25) 0 #000}
  .gcards{position:absolute;left:50%;top:calc(var(--u)*10);transform:translateX(-50%);display:flex;gap:calc(var(--u)*3)}
  .gcard{width:calc(var(--u)*27);padding:calc(var(--u)*1.4) calc(var(--u)*1.6);background:rgba(18,8,36,.88);cursor:pointer;text-align:center;
    border:calc(var(--u)*.35) solid #5b3a96;box-shadow:0 calc(var(--u)*.5) 0 #04020a;transition:transform .1s;color:#cdb8f5}
  .gcard.sel{border-color:#e0c8ff;background:#2a1458;transform:translateY(calc(var(--u)*-.7));
    box-shadow:0 calc(var(--u)*.5) 0 #04020a,0 0 calc(var(--u)*2) rgba(170,110,255,.6)}
  .gcard canvas{image-rendering:pixelated;display:block;margin:0 auto}
  .gcard .pv{width:calc(var(--u)*12);height:calc(var(--u)*14)}
  .gcard .pa{width:calc(var(--u)*23);height:auto;border:calc(var(--u)*.25) solid #3b2468}
  .gcard .nm{font-size:calc(var(--u)*2.6);letter-spacing:calc(var(--u)*.3);color:#fff;margin-top:calc(var(--u)*.6);text-shadow:calc(var(--u)*.2) calc(var(--u)*.2) 0 #000}
  .gcard .rl{font-size:calc(var(--u)*1.4);color:#ff9fe6;letter-spacing:calc(var(--u)*.3);margin-bottom:calc(var(--u)*.8)}
  .gcard .ds{font-size:calc(var(--u)*1.35);line-height:1.4;color:#c7a9f5;margin-top:calc(var(--u)*.7)}
  .srow{display:flex;justify-content:space-between;align-items:center;font-size:calc(var(--u)*1.25);margin:calc(var(--u)*.3) 0}
  .srow .seg{width:calc(var(--u)*.7);height:calc(var(--u)*1.1)}
  .gcard .sk{margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*1.15);line-height:1.55;text-align:left;color:#d9c8ff}
  .gcard .sk b{color:#ffc2f0}
  .ghint{position:absolute;left:0;right:0;bottom:calc(var(--u)*1.6);text-align:center;font-size:calc(var(--u)*1.35);letter-spacing:calc(var(--u)*.2);color:#9b7fd0}


  .gmain{position:absolute;left:50%;top:calc(var(--u)*8.5);transform:translateX(-50%);display:flex;gap:calc(var(--u)*2.5);width:calc(var(--u)*88);align-items:stretch}
  .gbigcard{width:calc(var(--u)*25);padding:calc(var(--u)*1) calc(var(--u)*1.2);background:rgba(18,8,36,.88);border:calc(var(--u)*.35) solid #e0c8ff;box-shadow:0 0 calc(var(--u)*2) rgba(170,110,255,.5);text-align:center;cursor:pointer;color:#cdb8f5}
  .gbig{width:calc(var(--u)*17);height:calc(var(--u)*19.8);image-rendering:pixelated;display:block;margin:0 auto}
  .gbigcard .nm{font-size:calc(var(--u)*2);letter-spacing:calc(var(--u)*.2);color:#fff;margin-top:calc(var(--u)*.4);text-shadow:calc(var(--u)*.2) calc(var(--u)*.2) 0 #000}
  .gbigcard .rl{font-size:calc(var(--u)*1.4);color:#ff9fe6;letter-spacing:calc(var(--u)*.3)}
  .ginfo{flex:1;padding:calc(var(--u)*1.4) calc(var(--u)*2);background:rgba(18,8,36,.88);border:calc(var(--u)*.35) solid #5b3a96;color:#d9c8ff}
  .ginfo .srow{font-size:calc(var(--u)*1.5);margin:calc(var(--u)*.5) 0}
  .ginfo .srow .seg{width:calc(var(--u)*.9);height:calc(var(--u)*1.3)}
  .ginfo .ds{font-size:calc(var(--u)*1.5);line-height:1.4;color:#c7a9f5;margin:calc(var(--u)*1.1) 0}
  .ginfo .sk{font-size:calc(var(--u)*1.4);line-height:1.6;color:#d9c8ff}
  .ginfo .sk b{color:#ffc2f0}
  .gpick{position:absolute;left:50%;top:calc(var(--u)*41);transform:translateX(-50%);display:flex;gap:calc(var(--u)*1.1)}
  .gtile{width:calc(var(--u)*13);padding:calc(var(--u)*.5) 0 calc(var(--u)*.6);text-align:center;cursor:pointer;background:rgba(18,8,36,.85);border:calc(var(--u)*.3) solid #3b2468;font-size:calc(var(--u)*1.15);color:#cdb8f5;letter-spacing:calc(var(--u)*.1)}
  .gtile canvas{width:calc(var(--u)*8);height:calc(var(--u)*8);image-rendering:pixelated;display:block;margin:0 auto}
  .gtile.sel{border-color:#e0c8ff;background:#2a1458;color:#fff;box-shadow:0 0 calc(var(--u)*1.5) rgba(170,110,255,.6)}
  #gov{position:absolute;inset:0;z-index:30;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,2,12,.72)}
  #gov.on{display:flex}
  #gov .ovt{font-size:calc(var(--u)*6);letter-spacing:calc(var(--u)*.8);margin-bottom:calc(var(--u)*.6);text-shadow:0 0 calc(var(--u)*1.6) currentColor,calc(var(--u)*.35) calc(var(--u)*.35) 0 #000}
  #gov .ovs{font-size:calc(var(--u)*1.8);color:#d9c8ff;margin-bottom:calc(var(--u)*3)}
  .gsouls{position:absolute;right:calc(var(--u)*9);top:calc(var(--u)*3.6);font-size:calc(var(--u)*1.8);color:#ffd0f8;letter-spacing:calc(var(--u)*.2)}
  .ginfo .cu{color:#ff7a7a}
  .ginfo .lvl{font-size:calc(var(--u)*1.4);color:#ffe27a;margin-top:calc(var(--u)*.9)}
  .ginfo .lvl small{color:#c7a9f5;font-size:calc(var(--u)*1.1)}
  .gnav{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*3.2);display:flex;gap:calc(var(--u)*1)}
  .mlist{position:absolute;left:50%;top:calc(var(--u)*11);transform:translateX(-50%);width:calc(var(--u)*70)}
  .mrow{background:rgba(18,8,36,.88);border:calc(var(--u)*.35) solid #5b3a96;padding:calc(var(--u)*1.2) calc(var(--u)*2);margin-bottom:calc(var(--u)*1.6)}
  .mt{font-size:calc(var(--u)*2);color:#fff}.mb{height:calc(var(--u)*1.2);background:#24103f;margin:calc(var(--u)*.8) 0;border:1px solid #5b3a96}.mf{height:100%;background:#ff4f8a}.mp{font-size:calc(var(--u)*1.4);color:#c7a9f5}
  .perks{margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*1.1);line-height:1.4}
  .pk{color:#7a6aa0}.pk.on{color:#d9c8ff}.pk.fin{color:#b58ad0}.pk.fin.on{color:#ffe27a}
  .gbtns{display:flex;gap:calc(var(--u)*1.2);margin-top:calc(var(--u)*1)}
  .gbtn{padding:calc(var(--u)*.7) calc(var(--u)*1.4);border:calc(var(--u)*.3) solid #e0c8ff;background:#3b1c70;color:#fff;font-size:calc(var(--u)*1.3);cursor:pointer;letter-spacing:calc(var(--u)*.1)}
  .gbtn.off{opacity:.4;border-color:#5b3a96}
  #gov .ovl{display:flex;flex-direction:column;gap:calc(var(--u)*1.1);width:calc(var(--u)*30)}


  .npan{position:absolute;left:50%;top:calc(var(--u)*10);transform:translateX(-50%);width:calc(var(--u)*92);max-height:calc(var(--u)*48);overflow:auto;color:#d9c8ff;text-align:center}
  .ninp{background:#140a28;border:calc(var(--u)*.3) solid #5b3a96;color:#fff;font:inherit;font-size:calc(var(--u)*1.4);padding:calc(var(--u)*.5) calc(var(--u)*.8);width:calc(var(--u)*30);outline:none}
  .ninp:focus{border-color:#e0c8ff}
  .nrow{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--u)*1);padding:calc(var(--u)*.4) calc(var(--u)*1);margin:calc(var(--u)*.3) 0;background:rgba(40,20,80,.6);border:calc(var(--u)*.2) solid #3b2670;font-size:calc(var(--u)*1.3)}
  .nchat{height:calc(var(--u)*17);overflow:auto;text-align:left;background:rgba(10,4,24,.8);border:calc(var(--u)*.2) solid #3b2670;padding:calc(var(--u)*.6);font-size:calc(var(--u)*1.2);line-height:1.5;margin:calc(var(--u)*.5) 0}
  .nmsg{color:#ff8a8a;font-size:calc(var(--u)*1.2);min-height:calc(var(--u)*1.8);margin-top:calc(var(--u)*.5)}
  .groom{position:absolute;left:50%;top:calc(var(--u)*34.5);transform:translateX(-50%);width:calc(var(--u)*94);color:#d9c8ff;text-align:center}
  .grow{display:flex;gap:calc(var(--u)*1);align-items:center;justify-content:center;margin-bottom:calc(var(--u)*.7)}
  .gl{font-size:calc(var(--u)*1.2);color:#9b7fd0;letter-spacing:calc(var(--u)*.2);margin-right:calc(var(--u)*.6)}
  .grow .gbtn{padding:calc(var(--u)*.45) calc(var(--u)*1)}.gbtn.sel{background:#6a2fd0;border-color:#fff}
  .gl2{position:absolute;left:50%;top:calc(var(--u)*7);transform:translateX(-50%);font-size:calc(var(--u)*1.3);color:#9b7fd0;letter-spacing:calc(var(--u)*.25)}
  .groom .gl{display:inline-block;min-width:calc(var(--u)*17);text-align:right}
  .ginf{font-size:calc(var(--u)*1.15);line-height:1.5;color:#c7a9f5;margin:calc(var(--u)*.3) 0 calc(var(--u)*.7)}
  .gbig2{display:inline-block;padding:calc(var(--u)*.7) calc(var(--u)*2.4);font-size:calc(var(--u)*1.5);background:#7a2fd0}

  /* ===== MODO CELULAR ===== */
  #touch{--b:min(19vh,13vw);position:fixed;inset:0;z-index:50;pointer-events:none;display:none;touch-action:none;font-family:"Courier New",monospace;font-weight:700}
  body.touchfight #touch{display:block}
  #touch *{touch-action:none;-webkit-user-select:none;user-select:none}
  #joy{position:absolute;left:max(3vw,env(safe-area-inset-left));bottom:7vh;width:calc(var(--b)*1.9);height:calc(var(--b)*1.9);border-radius:50%;pointer-events:auto;
    background:radial-gradient(circle,rgba(40,18,80,.35),rgba(20,8,44,.55));border:3px solid rgba(170,120,255,.55);box-shadow:0 0 18px rgba(150,90,255,.3)}
  #knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#d8b8ff,#7a3fd0);border:3px solid #f0e0ff;box-shadow:0 0 14px rgba(190,130,255,.7)}
  #tR{position:absolute;right:max(2vw,env(safe-area-inset-right));bottom:5vh;width:calc(var(--b)*2.7);height:calc(var(--b)*3.7)}
  .tb{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:auto;color:#fff;
    font-size:calc(var(--b)*.26);letter-spacing:.5px;background:rgba(36,14,72,.62);border:3px solid rgba(190,150,255,.7);
    text-shadow:1px 1px 0 #000;box-shadow:0 0 12px rgba(150,90,255,.3);transition:transform .05s}
  .tb.down{transform:scale(.9);background:rgba(120,60,210,.85);border-color:#fff}
  .tb.cd{opacity:.45}
  .tb.ready{border-color:#ffe27a;background:rgba(150,70,220,.85);box-shadow:0 0 20px rgba(255,200,120,.9);animation:rdy .5s steps(1) infinite}
  @keyframes rdy{50%{box-shadow:0 0 6px rgba(255,200,120,.4)}}
  #tA{right:0;bottom:0;width:calc(var(--b)*1.4);height:calc(var(--b)*1.4);font-size:calc(var(--b)*.34);border-color:#ff9fe6;background:rgba(160,40,120,.6)}
  #tD{right:calc(var(--b)*1.55);bottom:0;width:var(--b);height:var(--b)}
  #tS{right:0;bottom:calc(var(--b)*1.55);width:var(--b);height:var(--b)}
  #tQ{right:calc(var(--b)*1.7);bottom:calc(var(--b)*1.15);width:calc(var(--b)*.9);height:calc(var(--b)*.9)}
  #tE{right:calc(var(--b)*1.2);bottom:calc(var(--b)*2.6);width:calc(var(--b)*.9);height:calc(var(--b)*.9)}
  #tpause{position:absolute;right:max(3vw,env(safe-area-inset-right));top:20vh;width:calc(var(--b)*.62);height:calc(var(--b)*.62);pointer-events:auto;border-radius:50%;
    background:rgba(20,8,44,.6);border:3px solid rgba(190,150,255,.6);color:#fff;font:inherit;font-size:calc(var(--b)*.26);display:flex;align-items:center;justify-content:center;opacity:.8}
  #rot{position:fixed;inset:0;z-index:100;background:#07040f;color:#e9ddff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    font-family:"Courier New",monospace;font-weight:700;padding:24px;gap:18px}
  #rot .ic{font-size:64px;animation:rotp 2s ease-in-out infinite}
  #rot .tt{font-size:22px;letter-spacing:3px;color:#ff9fe6}
  @keyframes rotp{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
  @media (pointer:coarse){#hint,.ghint{display:none!important}#gscan{display:none!important}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="320" height="180"></canvas>
  <div class="fx dim"></div>
  <div class="fx vig"></div>
  <div class="fx scan"></div>

  <div id="titleWrap">
    <canvas id="title" width="120" height="30"></canvas>
    <div id="sub">エスピリタル</div>
  </div>

  <div id="splash">CLIQUE PARA COMEÇAR</div>
  <div id="menu"></div>
<canvas id="game" width="640" height="360"></canvas>
  <div class="fx scan" id="gscan"></div>
  <div id="gui"></div>
  <div id="gov"></div>
  <div id="toast"></div>

<script>
(()=>{
'use strict';
const stage=document.getElementById('stage');

/* ================= CONFIGURAÇÕES SALVAS ================= */

applyVisual();

/* ================= TÍTULO EM PIXEL ART ================= */
const GL={
A:['01110','10001','10001','11111','10001','10001','10001'],
R:['11110','10001','10001','11110','10100','10010','10001'],
E:['11111','10000','10000','11110','10000','10000','11111'],
S:['01111','10000','10000','01110','00001','00001','11110'],
T:['11111','00100','00100','00100','00100','00100','00100'],
L:['10000','10000','10000','10000','10000','10000','11111'],
Q:['01110','10001','10001','10001','10101','10010','01101'],
U:['10001','10001','10001','10001','10001','10001','01110'],
I:['01110','00100','00100','00100','00100','00100','01110'],
V:['10001','10001','10001','10001','10001','01010','00100'],
O:['01110','10001','10001','10001','10001','10001','01110'],
D:['11110','10001','10001','10001','10001','10001','11110'],
P:['11110','10001','10001','11110','10000','10000','10000']};
function lerpHex(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);
  return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'}
function drawWord(c,str,x0,y0,s,top,bot){
  const px=[];
  [...str].forEach((ch,li)=>{GL[ch].forEach((row,r)=>{[...row].forEach((v,col)=>{
    if(v==='1')px.push({x:x0+(li*6+col)*s,y:y0+r*s,r});});});});
  [[2,2,1,'#2a0f55'],[0,0,1,'#05020c']].forEach(([dx,dy,e,col])=>{
    c.fillStyle=col;px.forEach(p=>c.fillRect(p.x+dx-e,p.y+dy-e,s+2*e,s+2*e));});

}
(function title(){

/* ================= FUNDO: NOITE EM TÓQUIO ================= */
const W=320,H=180;
const bgc=document.getElementById('bg'),ctx=bgc.getContext('2d');ctx.imageSmoothingEnabled=false;
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261114);

const [skyC,sk]=mk(),[backC,bk]=mk(),[frontC,fr]=mk();
function disc(c,cx,cy,r,col){c.fillStyle=col;for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r-y*y));c.fillRect(cx-w,cy+y,w*2+1,1)}}
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));

// céu em faixas
(function(){
  const st=[[0,'#05030c'],[.4,'#150a29'],[.7,'#33195a'],[1,'#5a3a8c']].map(s=>[s[0],hx(s[1])]);
  for(let y=0;y<H;y+=2){const t=y/H;let i=0;while(i<st.length-2&&t>st[i+1][0])i++;
    const[t0,a]=st[i],[t1,b]=st[i+1];const k=Math.min(1,Math.max(0,(t-t0)/(t1-t0)));
    sk.fillStyle='rgb('+a.map((v,j)=>Math.round(v+(b[j]-v)*k)).join(',')+')';sk.fillRect(0,y,W,2)}
  // lua
  sk.globalAlpha=.05;for(let r=36;r>14;r-=3)disc(sk,248,34,r,'#b79af0');sk.globalAlpha=1;
  disc(sk,248,34,13,'#ece2ff');disc(sk,243,30,3,'#cfbff0');disc(sk,254,39,2,'#cfbff0');disc(sk,252,27,2,'#d8caf5');
})();

const stars=[];
for(let i=0;i<80;i++){const x=Math.floor(R()*W),y=Math.floor(R()*70);
  if(Math.hypot(x-248,y-34)<20)continue;
  stars.push({x,y,big:R()<.12,sp:.8+R()*2.4,ph:R()*6.28,c:['#ffffff','#e6d6ff','#ffd6f5'][Math.floor(R()*3)]})}
const clouds=[];
for(let i=0;i<5;i++)clouds.push({x:R()*W,y:20+R()*50,w:40+R()*60,sp:1.5+R()*3});

const PAL=['#f6d6ff','#ffe4a8','#c8a6ff','#ff9fd6','#9fe8ff'];
const midBlink=[],nearBlink=[];
function city(ctx2,o){
  let x=-4;
  while(x<W){
    const w=Math.floor(o.wmin+R()*(o.wmax-o.wmin));
    let top=o.tmin+R()*(o.tmax-o.tmin);
    if(o.side&&(x<56||x>264))top-=25+R()*22;
    top=Math.floor(top);
    ctx2.fillStyle=o.col;ctx2.fillRect(x,top,w,H-top);
    if(o.edge){ctx2.fillStyle=o.edge;ctx2.fillRect(x,top,w,1)}
    ctx2.fillStyle=o.col;
    const r=R();
    if(r<.22)ctx2.fillRect(x+Math.floor(w/2),top-6,1,6);
    else if(r<.4)ctx2.fillRect(x+2,top-3,Math.max(3,w-6),3);
    for(let wy=top+4;wy<H-12;wy+=4)for(let wx=x+2;wx<x+w-3;wx+=4){
      if(R()<o.winP){
        const c=o.pal[Math.floor(R()*o.pal.length)];
        if(R()<o.blinkP)o.list.push({x:wx,y:wy,c,on:R()<.6,t:R()*8});
        else{ctx2.fillStyle=c;ctx2.fillRect(wx,wy,2,2)}
      }
    }
    if(o.signs&&w>=18&&R()<.55)signs.push({x:x+3+Math.floor(R()*(w-8)),y:top+5,w:3,h:Math.floor(10+R()*16),
      c:['#ff5fd2','#7cf3ff','#b58cff','#ffb36b'][Math.floor(R()*4)],ph:R()*10,fl:R()<.35});
    x+=w+(o.gap?Math.floor(R()*o.gap):0);

}
const signs=[];
// prédios distantes
city(bk,{tmin:84,tmax:124,wmin:12,wmax:28,col:'#2b1752',edge:'#3d2670',winP:.12,blinkP:0,pal:['#6a4aa8','#8a64c8'],list:midBlink,side:false});
// Tokyo Tower
(function(){

    for(let y=a;y<=b;y++){const t=(y-a)/(b-a);

      bk.fillRect(cx+xa,y,1,1);bk.fillRect(cx+xb,y,1,1)}}
  bk.fillStyle='#d4557a';
  for(let y=top;y<=bot;y++){bk.fillRect(cx-hw(y),y,1,1);bk.fillRect(cx+hw(y),y,1,1);bk.fillRect(cx-hw(y)+1,y,1,1);bk.fillRect(cx+hw(y)-1,y,1,1)}
  bk.fillStyle='#ffa8c4';
  [top+14,top+48].forEach(y=>bk.fillRect(cx-hw(y)-2,y,hw(y)*2+5,2));
  bk.fillStyle='#d4557a';bk.fillRect(cx,top-12,1,12);bk.fillRect(cx-1,top-6,3,1);
})();
// prédios do meio
city(bk,{tmin:104,tmax:140,wmin:14,wmax:30,col:'#1a0d33',edge:'#2c1857',winP:.3,blinkP:.35,pal:PAL,list:midBlink,side:true});
// viaduto do trem
bk.fillStyle='#0f0820';bk.fillRect(0,120,W,3);bk.fillStyle='#34206a';bk.fillRect(0,120,W,1);
for(let x=10;x<W;x+=30)bk.fillRect(x,123,4,H-123);
// postes e fios
function wire(c,x0,x1,y,sag,col){c.fillStyle=col;for(let x=x0;x<=x1;x++){const t=(x-x0)/(x1-x0);c.fillRect(x,Math.round(y+sag*4*t*(1-t)),1,1)}}
// prédios da frente
city(fr,{tmin:130,tmax:160,wmin:22,wmax:40,col:'#0b0617',edge:'#1d1038',winP:.2,blinkP:.3,pal:PAL,list:nearBlink,side:true,signs:true,gap:3});
(function(){
  fr.fillStyle='#07040e';fr.fillRect(0,170,W,10);
  fr.fillStyle='#2e1a55';fr.fillRect(0,170,W,1);
  fr.fillStyle='#3b2468';for(let x=4;x<W;x+=20)fr.fillRect(x,175,9,1);
  // postes
  [[14,70],[306,70]].forEach(([x,y])=>{fr.fillStyle='#07040e';fr.fillRect(x,y,3,H-y);fr.fillRect(x-6,y+2,15,2);fr.fillRect(x-4,y+9,11,1)});
  wire(fr,8,302,72,16,'#07040e');wire(fr,8,302,75,17,'#07040e');wire(fr,8,302,78,18,'#07040e');
})();

/* ================= ANIMAÇÃO ================= */
const rain=[];for(let i=0;i<70;i++)rain.push({x:R()*W,y:R()*H,sp:130+R()*90,l:2+Math.floor(R()*3)});
let train={x:-140,on:false,next:5},shoot=null,shootNext=6;
const TL=120,TY=113;
let last=performance.now(),acc=0,T=0;
function draw(dt){
  T+=dt;
  ctx.drawImage(skyC,0,0);
  stars.forEach(s=>{ctx.globalAlpha=.3+.7*(.5+.5*Math.sin(T*s.sp+s.ph));ctx.fillStyle=s.c;ctx.fillRect(s.x,s.y,s.big?2:1,s.big?2:1)});
  ctx.globalAlpha=1;
  // estrela cadente
  shootNext-=dt;
  if(!shoot&&shootNext<=0){shoot={x:150+R()*120,y:6+R()*20,life:0};shootNext=10+R()*10}
  if(shoot){shoot.life+=dt;const k=shoot.life*70;
    for(let i=0;i<9;i++){ctx.globalAlpha=(1-i/9)*(1-shoot.life/1.1);ctx.fillStyle='#fff';ctx.fillRect(Math.round(shoot.x-k+i*1.6),Math.round(shoot.y+k*.4-i*.6),1,1)}
    ctx.globalAlpha=1;if(shoot.life>1.1)shoot=null}
  // nuvens
  clouds.forEach(c=>{c.x+=c.sp*dt;if(c.x>W+10)c.x=-c.w-10;
    ctx.fillStyle='rgba(150,110,220,.2)';ctx.fillRect(c.x,c.y,c.w,2);ctx.fillRect(c.x+6,c.y-2,c.w-14,2);ctx.fillRect(c.x+3,c.y+2,c.w-8,1)});
  ctx.drawImage(backC,0,0);
  // luz da torre
  ctx.fillStyle=(Math.floor(T*1.1)%2)?'#ff4f6e':'#5a1a30';ctx.fillRect(63,26,3,2);
  // janelas piscando (meio)
  blinkWins(midBlink,dt);
  // trem
  train.next-=dt;
  if(!train.on&&train.next<=0){train.on=true;train.x=-TL-10}
  if(train.on){train.x+=75*dt;
    const x=Math.round(train.x);
    for(let car=0;car<4;car++){const cx=x+car*(TL/4);
      ctx.fillStyle='#2a1850';ctx.fillRect(cx,TY,TL/4-2,7);
      ctx.fillStyle='#6a4aa8';ctx.fillRect(cx,TY,TL/4-2,1);
      ctx.fillStyle='#ffe7a6';for(let w=3;w<TL/4-6;w+=6)ctx.fillRect(cx+w,TY+2,3,3)}
    ctx.fillStyle='#fff';ctx.fillRect(x+TL-3,TY+4,2,2);
    if(train.x>W+10){train.on=false;train.next=16+R()*10}}
  ctx.drawImage(frontC,0,0);
  blinkWins(nearBlink,dt);
  // neons
  signs.forEach(s=>{
    let a=.8+.2*Math.sin(T*3+s.ph);
    if(s.fl&&Math.sin(T*7+s.ph*3)>.85)a=.15;
    ctx.fillStyle=s.c;
    ctx.globalAlpha=.16*a;ctx.fillRect(s.x-2,s.y-2,s.w+4,s.h+4);
    ctx.globalAlpha=a;ctx.fillRect(s.x,s.y,s.w,s.h);
    ctx.globalAlpha=a*.9;ctx.fillStyle='#fff';ctx.fillRect(s.x+1,s.y+1,1,s.h-2);
    ctx.globalAlpha=.14*a;ctx.fillStyle=s.c;ctx.fillRect(s.x-1,171,s.w+2,8);
  });
  ctx.globalAlpha=1;
  // chuva
  if(S.rain){ctx.fillStyle='rgba(205,184,255,.38)';
    rain.forEach(d=>{d.y+=d.sp*dt;d.x-=d.sp*dt*.18;if(d.y>H){d.y=-4;d.x=R()*(W+40)}if(d.x<0)d.x+=W;
      ctx.fillRect(Math.round(d.x),Math.round(d.y),1,d.l)})}
}
function blinkWins(list,dt){
  list.forEach(w=>{w.t-=dt;if(w.t<=0){w.on=!w.on;w.t=2+R()*9}
    if(w.on){ctx.fillStyle=w.c;ctx.fillRect(w.x,w.y,2,2)}});
}
function loop(now){
  requestAnimationFrame(loop);
  if(window.__dripFight)return;
  const d=(now-last)/1000;
  if(d<1/30)return;
  last=now;draw(Math.min(d,.1));
}
requestAnimationFrame(loop);

/* ================= ÁUDIO ================= */
let AC=null,master,musicBus,sfxBus,verb,noiseBuf,timer=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function applyAudio(){if(!AC)return;master.gain.value=S.muted?0:1;musicBus.gain.value=S.music*.9;sfxBus.gain.value=S.sfx}
function initAudio(){
  if(AC)return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.connect(AC.destination);
  musicBus=AC.createGain();musicBus.connect(master);
  sfxBus=AC.createGain();sfxBus.connect(master);
  const LITE=matchMedia('(pointer:coarse)').matches,len=Math.floor(AC.sampleRate*(LITE?1.1:2.4)),NC=LITE?1:2,b=AC.createBuffer(NC,len,AC.sampleRate);
  for(let c=0;c<NC;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const conv=AC.createConvolver();conv.buffer=b;verb=AC.createGain();verb.gain.value=.5;verb.connect(conv);conv.connect(musicBus);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  applyAudio();
}
function env(g,t,a,peak,d,end){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+d);}
function pluck(t,m,vol){ // koto
  const f=mtof(m),o=AC.createOscillator(),o2=AC.createOscillator(),g2=AC.createGain(),g=AC.createGain(),lp=AC.createBiquadFilter();
  o.type='triangle';o.frequency.setValueAtTime(f*1.012,t);o.frequency.exponentialRampToValueAtTime(f,t+.04);
  o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.35;
  lp.type='lowpass';lp.frequency.setValueAtTime(4200,t);lp.frequency.exponentialRampToValueAtTime(900,t+.6);
  env(g,t,.004,vol,1.1);
  o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(musicBus);g.connect(verb);
  o.start(t);o2.start(t);o.stop(t+1.2);o2.stop(t+1.2);
}
function lead(t,m,dur){ // flauta
  const f=mtof(m),o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain();
  o.type='sine';o.frequency.value=f;l.frequency.value=5.5;lg.gain.value=f*.006;l.connect(lg);lg.connect(o.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.06,t+.07);g.gain.setValueAtTime(.06,t+dur);g.gain.exponentialRampToValueAtTime(.0008,t+dur+.5);
  o.connect(g);g.connect(musicBus);g.connect(verb);
  o.start(t);l.start(t);o.stop(t+dur+.6);l.stop(t+dur+.6);
}
function pad(t,notes,dur){
  notes.forEach(m=>{(matchMedia('(pointer:coarse)').matches?[0]:[-6,6]).forEach(c=>{
    const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=c;
    lp.type='lowpass';lp.frequency.value=650;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.011,t+.6);g.gain.setValueAtTime(.011,t+dur-.2);g.gain.linearRampToValueAtTime(0,t+dur+.4);
    o.connect(lp);lp.connect(g);g.connect(musicBus);g.connect(verb);o.start(t);o.stop(t+dur+.5);
  })});
}
function bass(t,m){
  const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=mtof(m);
  env(g,t,.01,.2,.7);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+.8);
}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);
  g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(musicBus);o.start(t);o.stop(t+.25)}
function noise(t,type,freq,vol,dur,send){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  s.connect(f);f.connect(g);g.connect(musicBus);if(send)g.connect(verb);s.start(t);s.stop(t+dur+.05)}
const snare=t=>noise(t,'bandpass',1800,.14,.16,true);
const hat=(t,v)=>noise(t,'highpass',7500,v,.04,false);

// Escala Hirajoshi em Lá: A B C E F
const ARP=[[69,72,76,72,69,72,76,77],[65,69,72,69,65,69,72,76],[64,71,72,71,64,71,76,72],[64,71,76,71,64,71,72,71]];
const BASS=[45,41,48,40];
const PADS=[[57,60,64,69],[53,57,60,64],[55,60,64,71],[52,59,64,67]];
const MEL=[
 [[88,0,0,84,0,81,0,0],[84,0,81,0,89,0,88,0],[88,0,84,0,83,0,0,0],[83,0,88,0,0,84,81,0]],
 [[81,0,84,0,88,0,84,0],[89,0,0,88,0,84,0,0],[83,0,84,0,88,0,0,0],[0,0,88,84,83,0,81,0]]];
let fightMode=false;const SP=60/82/2;const spNow=()=>60/(fightMode?108:82)/2;
let step=0,nextT=0;
function playStep(n,t){
  const bar=Math.floor(n/8)%4,s=n%8,v=n>=32?1:0;
  if(s===0)pad(t,PADS[bar],spNow()*8);
  if(s===0||s===4||(s===6&&v))bass(t,BASS[bar]);
  pluck(t,ARP[bar][s],s%2?.05:.085);
  const m=MEL[v][bar][s];if(m)lead(t,m,spNow()*2.2);
  if(n>=8||fightMode){if(s===0||s===5||(fightMode&&s===2))kick(t);if(s===4)snare(t);hat(t,s%2?.03:.016)}
}
/* --- loops pré-renderizados (tocam na thread de áudio: não travam com o jogo) --- */
const LOOPS={},LSRC={},LGAIN={};let bakeStarted=false;
function bakeLoop(fight){
  return new Promise(res=>{try{
    const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OC)return res(null);

      if(f.root>0){f.vx=0;f.vy=0;f.moving=false}
      if(it.dodge&&cd.dodge<=0)startDodge(f,mx,my,foe);
      else if(it.special&&f.en>=100)MV[f.def.id].special(f,foe);
      else if(it.atk&&cd.atk<=0)MV[f.def.id].attack(f,foe);
      if(it.q&&cd.q<=0&&!f.sp&&f.dodgeT<=0)MV[f.def.id].q(f,foe);
      if(it.e&&cd.e<=0&&!f.sp&&f.dodgeT<=0)MV[f.def.id].e(f,foe);
    }else{f.vx=f.vy=0;f.moving=false}

  }
  f.x+=(f.vx+f.kx)*dt;f.y+=(f.vy+f.ky)*dt;

function projThreat(f){for(const p of projs){if(p.owner===f)continue;const dx=f.x-p.x,dy=f.y-p.y,d=Math.hypot(dx,dy);
  if(d<110&&p.vx*dx+p.vy*dy>0){const sp=Math.hypot(p.vx,p.vy);if(Math.abs(p.vx*dy-p.vy*dx)/sp<(p.r||6)+16)return true}}return false}
function aiIntent(f,o,dt){
  const a=f.ai,S=a.style,D=f.def;
  const it={mx:0,my:0,aimx:o.x+o.vx*.18,aimy:o.y+o.vy*.18,atk:false,special:false,q:false,e:false,dodge:false};
  a.react-=dt;a.dodgeCd-=dt;a.strafeT-=dt;a.modeT-=dt;a.stuck+=dt;
  const dx=o.x-f.x,dy=o.y-f.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d;
  if(a.strafeT<=0){a.strafe*=-1;a.strafeT=rnd(1,2.4)}
  if(a.stuck>1){if(Math.hypot(f.x-a.lx,f.y-a.ly)<12){a.strafe*=-1;a.strafeT=1.4}a.lx=f.x;a.ly=f.y;a.stuck=0}
  let want;
  if(S==='agressiva')want=D.range*.7;
  else if(S==='defensiva')want=D.pref+55;
  else{if(a.modeT<=0){a.mode=a.mode==='press'?'kite':'press';a.modeT=a.mode==='press'?rnd(3,5):rnd(1.2,2.4)}want=a.mode==='press'?D.range*.9:D.pref+35}
  let mx=0,my=0;
  if(d>want+8){mx=ux;my=uy;if(S!=='agressiva'){mx+=-uy*a.strafe*.5;my+=ux*a.strafe*.5}}
  else if(d<want-10){mx=-ux;my=-uy;if(S==='defensiva'){mx+=-uy*a.strafe*.6;my+=ux*a.strafe*.6}}
  else{mx=-uy*a.strafe;my=ux*a.strafe}
  for(const ob of arena.obs){const ox=f.x-ob.x,oy=f.y-ob.y,od=Math.hypot(ox,oy),lim=ob.r+f.def.r+30;
    if(od<lim&&od>.1){const w=(lim-od)/30;mx+=ox/od*w*1.5-oy/od*a.strafe*w*.9;my+=oy/od*w*1.5+ox/od*a.strafe*w*.9}}
  for(const z of zones){if(z.owner===f)continue;const zx=f.x-z.x,zy=f.y-z.y,zd=Math.hypot(zx,zy),lim=z.r+f.def.r+18;if(zd<lim&&zd>.1){mx+=zx/zd*1.4;my+=zy/zd*1.4}}
  const ed=edgeOf(arena,f);
  if(ed>.8){const k=(ed-.8)*8,vx=arena.cx-f.x,vy=arena.cy-f.y,vl=Math.hypot(vx,vy)||1;mx+=vx/vl*k;my+=vy/vl*k}
  it.mx=mx;it.my=my;
  const osp=o.sp&&(o.sp.type==='ring'||o.sp.type==='beam')&&o.sp.el>.12&&d<(o.sp.r||o.sp.len||160)+20;
  const threat=(o.atkT>.05&&d<o.def.range+44)||osp||projThreat(f);
  if(threat&&a.dodgeCd<=0&&f.cd.dodge<=0){
    const pr=S==='defensiva'?.7:S==='equilibrada'?.45:.22;
    if(Math.random()<pr){it.dodge=true;it.mx=-uy*a.strafe;it.my=ux*a.strafe}
    a.dodgeCd=rnd(.6,1.4)}
  if(d<=D.range+6&&a.react<=0&&f.cd.atk<=0){it.atk=true;a.react=S==='agressiva'?rnd(.05,.2):rnd(.18,.4)}
  if(f.cd.q<=0&&d>60&&d<D.qMax&&Math.random()<(S==='defensiva'?2.2:S==='agressiva'?.8:1.4)*dt)it.q=true;
  if(f.cd.e<=0){const hp=f.hp/D.hp;
    switch(D.eAI){
      case 'heal':if(hp<.7&&Math.random()<1.5*dt)it.e=true;break;
      case 'fade':if((threat||(o.atkT>0&&d<80))&&Math.random()<.8)it.e=true;break;
      case 'guard':if(o.atkT>0&&d<84&&Math.random()<(S==='defensiva'?.9:.5)*Math.min(1,dt*20))it.e=true;break;
      case 'root':if(d<230&&d>70&&Math.random()<1.2*dt)it.e=true;break;
      case 'wings':if(d>130&&Math.random()<.8*dt)it.e=true;break;
      case 'blink':if((d>150||(threat&&hp<.8))&&Math.random()<1*dt)it.e=true;break}}
  if(f.en>=100&&d<D.spRange&&d>(D.spMin||0)&&Math.random()<2*dt)it.special=true;
  return it}

  if(!botOn){if(P.cd.q>0)buf.q=0;if(P.cd.e>0)buf.e=0;if(P.cd.dodge>0)buf.d=0;if(P.en<100||P.sp)buf.r=0}

function duelKey(k){
  if(k==='ArrowLeft'||k==='KeyA')DUEL.opp=DUEL.opp<=-1?CON.length-1:DUEL.opp-1;
  else if(k==='ArrowRight'||k==='KeyD')DUEL.opp=DUEL.opp>=CON.length-1?-1:DUEL.opp+1;
  else if(k==='ArrowUp'||k==='KeyW')DUEL.lvl=(DUEL.lvl+2)%3;
  else if(k==='ArrowDown'||k==='KeyS')DUEL.lvl=(DUEL.lvl+1)%3;
  else if(k==='KeyG')DUEL.wid=DUEL.wid>=WEAP.length-1?-1:DUEL.wid+1;
  else if(k==='KeyT')DUEL.style=DUEL.style>=2?-1:DUEL.style+1;
  else if(k==='KeyN')DUEL.equal=DUEL.equal?0:1;
  else if(k==='KeyR')DUEL.arena=(DUEL.arena+1)%3;
  else if(k==='Enter'||k==='Space'){snd('ui');showChars();return}
  else if(k==='Escape'||k==='Backspace'){snd('back');duelOn=false;goMenu();return}
  else return;
  snd('sel');showDuelRoom()}

  projs=[];parts=[];fxs=[];floats=[];zones=[];shake=0;hitstop=0;ts=1;T=0;stT=0;koT=0;state='intro';paused=false;winner=null;beepN=-1;tipT=0;
  P.ang=0;E.ang=Math.PI;updCam(0,true);

function idleIt(f,o){return{mx:0,my:0,aimx:o.x,aimy:o.y,atk:false,special:false,q:false,e:false,dodge:false}}

function step(dt){
  if(paused||state==='off')return;
  shake=Math.max(0,shake-22*dt);
  if(hitstop>0){hitstop-=dt;return}
  if(hordeOn){if(duelOn)(NETM==='guest'?stepGuest(dt):stepDuel(dt));else if(bossOn)stepBoss(dt);else stepHorde(dt);return}
  const sdt=dt*ts;T+=sdt;stT+=dt;
  for(const k of ['q','e','d','r'])buf[k]=Math.max(0,buf[k]-dt);
  if(state==='intro'){
    updFighter(P,idleIt(P,E),sdt,E);updFighter(E,idleIt(E,P),sdt,P);
    const n=stT<2?-1:stT<2.6?3:stT<3.2?2:stT<3.8?1:0;
    if(n!==beepN){beepN=n;if(n>0)snd('beep');else if(n===0){snd('go')}}
    if(stT>=3.8){state='fight';stT=0}
  }else if(state==='fight'||state==='ko'||state==='over'){
    const live=state==='fight';
    const pit=live?playerIntent():idleIt(P,E),eit=live?aiIntent(E,P,sdt):idleIt(E,P);
    updFighter(P,pit,sdt,E);updFighter(E,eit,sdt,P);
    if(!autoP){if(P.cd.q>0)buf.q=0;if(P.cd.e>0)buf.e=0;if(P.cd.dodge>0)buf.d=0;if(P.en<100||P.sp)buf.r=0}
    const dx=E.x-P.x,dy=E.y-P.y,d=Math.hypot(dx,dy),rs=P.def.r+E.def.r-2;
    if(d<rs&&d>.01&&!(P.dodgeT>0||E.dodgeT>0)){const pu=(rs-d)/2;P.x-=dx/d*pu;P.y-=dy/d*pu;E.x+=dx/d*pu;E.y+=dy/d*pu;constrain(P);constrain(E)}
    tipT+=dt;
    if(live&&(P.hp<=0||E.hp<=0)){state='ko';stT=0;koT=0;ts=.28;winner=E.hp<=0?'P':'E';const L=winner==='P'?E:P;snd('ko');shake=10;burst(L.x,L.y,40,['#ffffff','#ffd23a','#ff5a1e'],200,{g:0})}
    if(state==='ko'){koT+=dt;if(koT>1.7){ts=1;state='over';showResult()}}
  }
  stepWorld(sdt);
  updCam(dt,false);
}

    c.strokeStyle='#ffd86a';c.globalAlpha=(1-p)*.6;c.lineWidth=22*(1-p*.5);c.beginPath();c.moveTo(fx.x,fx.y);c.lineTo(ex,ey);c.stroke();
    c.strokeStyle='#fff3b0';c.globalAlpha=1-p;c.lineWidth=12*(1-p);c.beginPath();c.moveTo(fx.x,fx.y);c.lineTo(ex,ey);c.stroke();
    c.strokeStyle='#ffffff';c.lineWidth=5*(1-p);c.beginPath();c.moveTo(fx.x,fx.y);c.lineTo(ex,ey);c.stroke();c.globalAlpha=1;c.lineCap='butt'}
  else if(fx.k==='chainfx'){c.globalAlpha=1-p;const n=9;for(let i=1;i<=n;i++){const u=i/n,lx=Math.round(fx.x+(fx.x2-fx.x)*u),ly=Math.round(fx.y+(fx.y2-fx.y)*u);rect(c,lx-1,ly-1,3,3,i%2?'#c8c8d8':'#ffffff')}c.globalAlpha=1}

  else if(fx.k==='star'){c.fillStyle=fx.col;c.globalAlpha=1-p;for(let i=0;i<8;i++){const a=i*TAU/8,r0=2+p*5,r1=5+p*9;for(let r=r0;r<r1;r+=2)c.fillRect(Math.round(fx.x+Math.cos(a)*r),Math.round(fx.y+Math.sin(a)*r),1,1)}c.globalAlpha=1}
}

function roomKey(k){

  else if(k==='ArrowUp'||k==='KeyW'){ROOM.diff=(ROOM.diff+2)%3;snd('sel');showBossRoom()}
  else if(k==='ArrowDown'||k==='KeyS'){ROOM.diff=(ROOM.diff+1)%3;snd('sel');showBossRoom()}
  else if(k==='Digit2'||k==='Digit3'||k==='Digit4'){const j=+k.slice(-1)-2;ROOM.slots[j]=(ROOM.slots[j]+1)%3;snd('sel');showBossRoom()}

function netConnect(name,addr){
  name=(name||'').trim()||'Pactuário';addr=(addr||'').trim();if(!addr)return netToast('Digite o endereço do servidor.');
  NET.name=name;NET.addr=addr;const cf=netCfg();NET.token=(cf.tokens&&cf.tokens[addr])||'';netCfgSave();
  let url=addr;if(!/^wss?:\/\//.test(url))url=(location.protocol==='https:'?'wss://':'ws://')+url.replace(/^https?:\/\//,'').replace(/\/+$/,'')+'/ws';
  if(NET.ws){try{NET.ws.onclose=null;NET.ws.close()}catch(e){}}
  NET.connecting=true;NET.status='Conectando...';if(mode==='net'&&NET.back===showOnline)showOnline();
  let ws;try{ws=new WebSocket(url)}catch(e){NET.connecting=false;NET.status='Endereço inválido.';showOnline();return}
  NET.ws=ws;const to=setTimeout(()=>{if(ws.readyState!==1){try{ws.close()}catch(e){}}},6000);
  ws.onopen=()=>{clearTimeout(to);nsend({t:'hello',name,token:NET.token})};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}netMsg(m)};
  ws.onclose=()=>{clearTimeout(to);if(NET.ws!==ws)return;const was=NET.ok;NET.ok=false;NET.connecting=false;NET.ws=null;
    NET.status=was?'Conexão perdida.':'Não foi possível conectar. Confira o endereço e se o servidor está ligado.';
    if(NETM){netPeerLeft('CONEXÃO PERDIDA')}else if(mode==='net')showOnline()};
}

function netMsg(m){
  switch(m.t){
    case 'welcome':{
      NET.ok=true;NET.connecting=false;NET.token=m.token;NET.name=m.name;NET.clan=m.clan;NET.stats=m.stats||NET.stats;NET.online=m.online;NET.status='';netCfgSave();
      if(m.save&&(m.rev|0)>(SAVE.rev|0)){Object.assign(SAVE,m.save);ensureSave();try{localStorage.setItem('espiritalSave',JSON.stringify(SAVE))}catch(e){}NET.status='Progresso carregado da nuvem.'}
      else if(!m.save||(SAVE.rev|0)>(m.rev|0))nsend({t:'save',save:SAVE});
      if(mode==='net')showOnline();break}
    case 'err':netToast(m.m);break;
    case 'pong':NET.online=m.online;break;
    case 'rooms':NET.rooms=m.list;NET.online=m.online;if(mode==='net'&&NET.back===showOnline&&NET.view==='duel')drawRooms();break;
    case 'room.created':NET.code=m.code;NET.view='wait';showNetWait('SALA '+m.code,'Passe este código para seu amigo. Aguardando adversário...');break;
    case 'room.joined':NET.code=m.code;NET.peer=m.host;NET.hostLo=m.lo;NET.view='wait';showNetWait('SALA '+m.code,'Entrou na sala de '+m.host+'. Aguardando o anfitrião iniciar...');break;
    case 'room.guest':NET.peer=m.name;NET.guestLo=m.lo;netStartHost();break;
    case 'room.left':netPeerLeft('O ADVERSÁRIO SAIU');break;
    case 'rel':netRel(m.d);break;
    case 'clan.list':NET.clans=m.list;if(NET.view==='clan'&&mode==='net')drawClans();break;
    case 'clan.info':{const had=!!NET.clan;NET.clan=m.clan;if(NET.view==='clan'&&mode==='net'&&(had!==!!m.clan||m.clan))showClan(true);break}
    case 'clan.msg':if(NET.clan&&NET.clan.chat){NET.clan.chat.push(m.m);if(NET.clan.chat.length>60)NET.clan.chat.shift()}if(NET.view==='clan'&&mode==='net')drawChat();break;
  }}

const FKm=o=>{const r={};for(const k in o){const v=o[k];if(typeof v==='number')r[k]=Math.round(v*100)/100;else if(typeof v==='boolean'||typeof v==='string')r[k]=v}return r};

function netSnap(dt){

function applyF(dst,s){for(const k in s){if(k==='cd')Object.assign(dst.cd,s.cd);else if(k==='sp'||k==='x'||k==='y')continue;else dst[k]=s[k]}dst.sp=s.sp||null;

function stepGuest(dt){

    p.vx*=Math.exp(-p.d*sdt);p.vy=p.vy*Math.exp(-p.d*sdt)+p.g*sdt;p.x+=p.vx*sdt;p.y+=p.vy*sdt}

  NET.acc+=dt;if(NET.acc>=1/30){NET.acc=0;const it=(state==='fight'||state==='intro')&&mode==='fight'?playerIntent():idleIt(P,O);

addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT'){if(e.code==='Enter'&&e.target.onenter){e.preventDefault();e.target.onenter()}else if(e.code==='Escape'){e.target.blur();if(NET.back){snd('back');NET.back()}}return}
  if(mode==='off')return;
  const k=e.code;
  if(mode==='fight'){
    if(k==='Escape'){e.preventDefault();pauseGame();return}
    if(k==='KeyM'){const d=dr();if(d&&!e.repeat)d.toggleMute();return}
    if(['KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','Space','ArrowUp','ArrowDown'].includes(k))e.preventDefault();
    if(!keys[k]){if(k==='KeyQ')buf.q=.18;else if(k==='KeyE')buf.e=.18;else if(k==='Space')buf.d=.18}
    keys[k]=true;return}
  e.preventDefault();
  if(performance.now()-lastNav<180)return;
  if(mode==='ov'){
    if(k==='ArrowUp'||k==='KeyW'){ovIdx=(ovIdx+ovItems.length-1)%ovItems.length;refreshOv();snd('sel')}
    else if(k==='ArrowDown'||k==='KeyS'){ovIdx=(ovIdx+1)%ovItems.length;refreshOv();snd('sel')}
    else if(k==='Enter'||k==='Space')runOv();

    return}
  if(mode==='net'){if(k==='Escape'||k==='Backspace'){snd('back');if(NET.back)NET.back()}return}
  if(mode==='room'){roomKey(k);return}
  if(mode==='duel'){duelKey(k);return}
  if(mode==='chars'){if(k==='KeyU'){upCon();return}if(k==='KeyB'){buyFrag();return}if(k==='KeyL'){showShop();return}if(k==='KeyM'){showMissions();return}}

    shop:{n:SKINS.length,get:()=>shopIdx,set:v=>{shopIdx=v;refreshShop()},ok:shopAct,back:showChars},
    missions:{n:1,get:()=>0,set:()=>{},ok:()=>{},back:showChars}}[mode];

  else if(k==='Escape'||k==='Backspace'){snd('back');NAV.back()}
